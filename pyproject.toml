[project]
name = "lab-work-8"
version = "0.1.0"
description = ""
authors = [
    {name = "Victoria-KA1",email = "ko4etovavictoria@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.34.2,<3.0.0)"
]

[project.scripts]
my-cli = "lab_work_8.cli:main"

[tool.poetry]
packages = [{include = "lab_work_8"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "flake8 (>=7.4.1,<8.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]